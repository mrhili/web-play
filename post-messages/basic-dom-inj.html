<!DOCTYPE html>
<html>
<head>
    <title>PostMessage XSS Demo</title>
</head>
<body>
    <h1>Message from postMessage:</h1>
    <div id="output"></div>

    <script>
        window.addEventListener('message', (event) => {
            // Directly insert received data into the DOM (vulnerable)
            document.getElementById('output').innerHTML = event.data;
        });
    </script>
</body>
</html>
